<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're on the List | House of Hatshepsut</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=general-sans@400,500,600&display=swap">
<style>
  :root{--bg:#0b0a08;--ink:#ece4d3;--ink-dim:#9c9384;--gold:#c9a15a;--gold-bright:#e0bc7a;--line:#2a2620;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'General Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:60px 5vw;}
  h1{font-family:'Clash Display',sans-serif;font-weight:600;font-size:clamp(2rem,5vw,2.8rem);}
  a{color:inherit;text-decoration:none;}
  .card{max-width:520px;text-align:center;}
  .eyebrow{font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:16px;}
  p{color:var(--ink-dim);margin-top:16px;line-height:1.7;}
  .gold{font-family:'Clash Display',sans-serif;color:var(--gold-bright);font-size:1.3rem;margin-top:22px;}
  .btn{display:inline-block;margin-top:30px;font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);border:1px solid var(--gold);padding:12px 22px;transition:background .25s,color .25s;}
  .btn:hover{background:var(--gold);color:var(--bg);}
</style>
</head>
<body>
<div class="card">
  <span class="eyebrow">House of Hatshepsut</span>
  <h1>You're on the list</h1>
  <p>Thank you. I will let you know as soon as I am back and the new line is ready.</p>
  <p class="gold">Until then, stay tuned.</p>
  <a class="btn" href="index.html">Back to House of Hatshepsut</a>
</div>
</body>
</html>
