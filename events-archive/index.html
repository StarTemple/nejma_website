<style>
  :root{--bg:#0b0a08;--bg-raised:#131110;--ink:#ece4d3;--ink-dim:#9c9384;--gold:#c9a15a;--gold-bright:#e0bc7a;--line:#2a2620;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--ink);font-family:'Jost',sans-serif;font-weight:300;overflow-x:hidden;}
  ::selection{background:var(--gold);color:#0b0a08;}
  a{color:inherit;text-decoration:none;}
  h1,h2,h3{font-family:'Big Shoulders Display',sans-serif;font-weight:600;letter-spacing:-0.02em;}
  .eyebrow{font-family:'Jost',sans-serif;font-size:.82rem;font-weight:500;letter-spacing:.05em;color:var(--gold);}

  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:18px 5vw;background:rgba(11,10,8,.75);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  .nav-name{font-family:'Big Shoulders Display',sans-serif;font-weight:600;font-size:1.35rem;letter-spacing:.03em;text-transform:uppercase;color:var(--gold);}
  .nav-back{display:inline-flex;align-items:center;gap:10px;font-weight:500;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);transition:color .25s ease;}
  .nav-back::before{content:"";width:8px;height:8px;background:var(--gold);clip-path:polygon(100% 0,0 50%,100% 100%);}
  .nav-back:hover{color:var(--gold-bright);}

  .top{max-width:1280px;margin:0 auto;padding:170px 5vw 30px;}
  .top h1{font-size:clamp(2.6rem,7vw,5.4rem);line-height:1;margin-top:0;}
  .top p{color:var(--ink-dim);max-width:520px;line-height:1.7;font-size:1.05rem;margin-top:22px;}
  .count{display:inline-block;margin-top:26px;font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.08em;color:var(--gold);}
  .top-rule{height:1px;margin-top:44px;background:linear-gradient(90deg,rgba(201,161,90,.6),rgba(201,161,90,0));}

  main{max-width:1280px;margin:0 auto;padding:0 5vw 40px;}
  .year{display:grid;grid-template-columns:200px 1fr;gap:40px;padding:64px 0 24px;}
  .year-label{position:relative;}
  .year-label h2{position:sticky;top:96px;font-size:clamp(2.4rem,4.6vw,3.6rem);line-height:1;}
  .year-label h2::after{content:"";display:block;width:44px;height:1px;margin-top:18px;background:var(--gold);}
  .sleeves{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:44px 28px;}
  .sleeve a{display:block;padding:10px;background:var(--bg-raised);border:1px solid var(--line);transition:border-color .35s ease, transform .35s ease, box-shadow .35s ease;}
  .sleeve img{display:block;width:100%;aspect-ratio:4/5;object-fit:contain;background:#0e0d0b;}
  .sleeve a:hover{border-color:var(--gold);transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.55);}
  figcaption{display:flex;flex-direction:column;gap:5px;margin-top:14px;}
  .sl-date{font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.04em;color:var(--gold);}
  .sl-title{font-family:'Big Shoulders Display',sans-serif;font-weight:600;font-size:1.02rem;line-height:1.25;color:var(--ink);}
  .sl-venue{font-size:.86rem;color:var(--ink-dim);line-height:1.5;}

  .divider{display:flex;align-items:center;justify-content:center;gap:16px;padding:40px 5vw 0;}
  .divider .rule{height:1px;flex:1;max-width:260px;background:linear-gradient(90deg,rgba(201,161,90,0),rgba(201,161,90,.55));}
  .divider .rule:last-child{transform:scaleX(-1);}
  .divider .mark{width:22px;height:22px;}
  footer{padding:48px 5vw 40px;text-align:center;}
  .btn{display:inline-block;font-weight:600;font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;padding:14px 26px;border:1px solid var(--gold);color:var(--gold-bright);transition:background .25s ease,color .25s ease;}
  .btn:hover{background:var(--gold);color:#0b0a08;}
  footer .copy{color:#6b6354;font-size:.78rem;letter-spacing:.04em;margin-top:30px;}

  [data-reveal]{opacity:0;transform:translateY(24px);transition:opacity .7s ease, transform .7s ease;}
  [data-reveal].in{opacity:1;transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){[data-reveal]{opacity:1;transform:none;transition:none;}html{scroll-behavior:auto;}}
  :focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px;}

  .lightbox{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:4vh 4vw;background:rgba(8,7,5,.94);cursor:zoom-out;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:92vh;object-fit:contain;border:1px solid var(--line);}
  .lightbox button{position:absolute;top:18px;right:22px;background:none;border:1px solid var(--gold);color:var(--gold-bright);font:600 .74rem 'Jost',sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:10px 16px;cursor:pointer;}

  .to-top{position:fixed;right:22px;bottom:22px;z-index:60;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:rgba(11,10,8,.88);border:1px solid var(--gold);cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .3s ease, transform .3s ease, background .25s ease;}
  .to-top.show{opacity:1;pointer-events:auto;transform:translateY(0);}
  .to-top:hover{background:var(--gold);}
  .to-top svg{width:16px;height:16px;}
  .to-top svg path{fill:var(--gold);transition:fill .25s ease;}
  .to-top:hover svg path{fill:var(--bg);}

  @media (max-width:860px){
    .year{grid-template-columns:1fr;gap:26px;padding-top:48px;}
    .year-label h2{position:static;}
    .sleeves{grid-template-columns:repeat(2,1fr);gap:34px 16px;}
    .top{padding-top:130px;}
  }
  @media (max-width:420px){.sleeve a{padding:6px;}.sl-title{font-size:.95rem;}}
  h1,h2,h3{text-transform:uppercase;font-weight:800;letter-spacing:.02em;}
</style>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Flyer"><img alt=""><button type="button">Close</button></div>
<button class="to-top" id="toTop" aria-label="Back to top"><svg viewBox="0 0 24 24"><path d="M12 3.5L21 20H3L12 3.5Z"/></svg></button>

<script>
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {threshold:.08});
  document.querySelectorAll('[data-reveal]').forEach(el=>io.observe(el));


  const lb = document.getElementById('lightbox');
  const lbImg = lb.querySelector('img');
  document.querySelectorAll('.sleeve a').forEach(a=>{
    a.addEventListener('click', ev=>{
      ev.preventDefault();
      lbImg.src = a.dataset.full;
      lbImg.alt = a.querySelector('img').alt;
      lb.classList.add('open');
    });
  });
  const closeLb = ()=>{ lb.classList.remove('open'); lbImg.removeAttribute('src'); };
  lb.addEventListener('click', closeLb);
  document.addEventListener('keydown', ev=>{ if(ev.key==='Escape') closeLb(); });

  const toTop = document.getElementById('toTop');
  const toggleTop = ()=>{ toTop.classList.toggle('show', window.scrollY > 700); };
  window.addEventListener('scroll', toggleTop, {passive:true});
  toggleTop();
  toTop.addEventListener('click', ()=>window.scrollTo({top:0, behavior:'smooth'}));
</script>
